name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` fails when a version bump forgot the lockfile, but only after
      # printing npm's whole help text. Name the drifted field instead.
      - run: npm run check:lockfile
      # The check must only read what it verifies: on the commit under test this
      # command has to leave both files untouched. 0.1.7 briefly rewired the
      # check to refresh the lockfile first, which made a stale commit pass.
      - run: git diff --exit-code -- package.json package-lock.json
      - run: npm ci
      - run: npm test
      # The action defaults to `verify`: pack the tarball, install it, and mount
      # the panel from the installed copy. `doctor` reads the working copy and
      # would still pass if `files` forgot the client bundle.
      - name: Preflight the tarball
        uses: WJDdidi-1/dsh-plugin-toolkit@v1
        with:
          dir: .
