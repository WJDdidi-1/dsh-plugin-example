name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The action defaults to `verify`: pack the tarball, install it, and mount
      # the panel from the installed copy. `doctor` reads the working copy and
      # would still pass if `files` forgot the client bundle.
      - name: Preflight the tarball
        uses: WJDdidi-1/dsh-plugin-toolkit@v1
        with:
          dir: .
